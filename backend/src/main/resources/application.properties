spring.application.name=skillmate-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/skillmate_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=skillmate-super-secret-key-for-jwt-token-generation-minimum-256-bits-required
jwt.expiration=86400000

# Groq API Configuration
groq.api.key=your-groq-api-key-here
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-70b-versatile

# Server Configuration
server.port=8080

# CORS Configuration
cors.allowed.origins=http://localhost:3000
